name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      coredns_version:
        description: 'CoreDNS version to build against (overrides the version pinned in go.mod)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  resolve:
    name: Resolve CoreDNS version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      gover: ${{ steps.resolve.outputs.gover }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          VERSION="${{ inputs.coredns_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -oP 'github.com/coredns/coredns v\K[0-9.]+' go.mod)"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not determine CoreDNS version from go.mod"
            exit 1
          fi
          GOVER="$(curl -fsSL "https://raw.githubusercontent.com/coredns/coredns/v${VERSION}/go.mod" | sed -n 's/^go[[:space:]]*//p' | head -1)"
          GOVER="${GOVER:-stable}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "gover=${GOVER}" >> "$GITHUB_OUTPUT"

  binary:
    name: Build binary (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [test, resolve]
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.resolve.outputs.gover }}
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          bash hack/build-coredns.sh "${{ needs.resolve.outputs.version }}" dist/coredns-ztnet-linux-${{ matrix.arch }}
          # -C dist only applies to the member paths, so the archive name is
          # given relative to the workspace root.
          tar -czf "dist/coredns-ztnet-v${{ needs.resolve.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" -C dist coredns-ztnet-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: coredns-ztnet-linux-${{ matrix.arch }}
          path: dist/coredns-ztnet-v${{ needs.resolve.outputs.version }}-linux-${{ matrix.arch }}.tar.gz

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test, resolve]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=coredns-${{ needs.resolve.outputs.version }}
            # "latest" tracks the most recent build from main or a release tag.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COREDNS_VERSION=${{ needs.resolve.outputs.version }}

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    # Runs only on tag pushes. Depends on the binary matrix job, so a release
    # is created only when BOTH architectures build successfully.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coredns-ztnet-linux-*
          merge-multiple: true
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
