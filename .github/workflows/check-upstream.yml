name: Bump CoreDNS version

on:
  schedule:
    # Weekly, Monday 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump CoreDNS dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compare versions
        id: compare
        run: |
          CURRENT="$(grep -oP 'github.com/coredns/coredns v\K[0-9.]+' go.mod)"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            LATEST="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/coredns/coredns/releases/latest | grep -oP '"tag_name":\s*"v\K[0-9.]+' | head -1)"
          else
            LATEST="$(curl -fsSL https://api.github.com/repos/coredns/coredns/releases/latest | grep -oP '"tag_name":\s*"v\K[0-9.]+' | head -1)"
          fi
          if [ -z "${CURRENT}" ] || [ -z "${LATEST}" ]; then
            echo "::error::could not read CoreDNS versions (current=${CURRENT:-empty}, latest=${LATEST:-empty})"
            exit 1
          fi
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
      - name: Update dependency and test
        if: steps.compare.outputs.latest != steps.compare.outputs.current
        run: |
          go get "github.com/coredns/coredns@v${{ steps.compare.outputs.latest }}"
          go mod tidy
          go test ./...
          go vet ./...
      - name: Open or update pull request
        if: steps.compare.outputs.latest != steps.compare.outputs.current
        env:
          BRANCH: chore/bump-coredns-v${{ steps.compare.outputs.latest }}
        run: |
          if gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -qx "$BRANCH"; then
            echo "Pull request for $BRANCH already exists"
            exit 0
          fi
          BODY="$(printf '%s\n' \
            'Auto-generated by the "Bump CoreDNS version" workflow.' \
            '' \
            '- Current CoreDNS pin: v${{ steps.compare.outputs.current }}' \
            '- Latest upstream release: v${{ steps.compare.outputs.latest }}' \
            '' \
            'Merging this makes the CD workflow compile the plugin against the new upstream CoreDNS version.')"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "chore: bump CoreDNS to v${{ steps.compare.outputs.latest }}"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump CoreDNS to v${{ steps.compare.outputs.latest }}" \
            --body "$BODY"
